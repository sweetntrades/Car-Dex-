<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAR-DEX — Car Spotter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090c;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:430px;min-height:100vh;margin:auto;background:#0b0d10;padding-bottom:82px}
header{height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252a31}
.logo{font-weight:900}.logo span{color:#d9ff4f}.count{font-size:12px;color:#8f969f}
main{padding:20px}.screen{display:none}.screen.active{display:block}
.hero{min-height:65vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
h1{font-size:45px;line-height:.96;letter-spacing:-2.5px;margin:0}.copy{color:#8f969f;line-height:1.5;margin:10px 0 22px}
button{font:inherit}.action{width:100%;height:58px;border-radius:18px;border:1px solid #292e36;background:#12151a;color:#f5f7fa;font-weight:800;margin-top:10px;cursor:pointer}.primary{background:#d9ff4f;color:#080a0c;border-color:#d9ff4f}
.scan{text-align:center;min-height:72vh;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring{width:190px;height:190px;border:1px solid #303740;border-radius:50%;position:relative;overflow:hidden;margin-bottom:22px}.line{position:absolute;left:0;right:0;top:10%;height:2px;background:#d9ff4f;box-shadow:0 0 18px #d9ff4f;animation:s 1.2s linear infinite alternate}@keyframes s{to{top:90%}}
.cardwrap{perspective:1200px;margin:10px auto;width:min(100%,350px);height:500px}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s;cursor:pointer}.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #d69e2e;border-radius:25px;overflow:hidden;background:#171a20;box-shadow:0 25px 70px #0009}.photo{width:100%;height:57%;object-fit:cover;background:#252a31}.info{padding:16px}.rarity{font-size:10px;text-transform:uppercase;font-weight:900;letter-spacing:1.5px}.name{font-size:25px;font-weight:900;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.label{font-size:9px;color:#7f8791;font-weight:900;letter-spacing:1px}.value{font-size:14px;font-weight:800;margin-top:3px}.back{transform:rotateY(180deg);padding:20px}.back h2{margin:0;font-size:25px}.hint{text-align:center;color:#7f8791;font-size:12px;margin:12px}.garageTitle{font-size:34px;font-weight:900;margin:0 0 8px}.filters{display:flex;gap:8px;overflow:auto;padding:10px 0 18px}.filter{white-space:nowrap;border:1px solid #292e36;background:#12151a;color:#a1a8b1;border-radius:999px;padding:9px 13px;cursor:pointer}.filter.active{background:#f5f7fa;color:#0a0c0f}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#14171c;border-radius:18px;padding:9px;cursor:pointer}.mini img{width:100%;aspect-ratio:.75;object-fit:cover;border-radius:12px;background:#252a31}.mini strong{display:block;margin-top:8px;font-size:14px}.mini small{display:block;margin-top:4px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px}.empty{color:#7f8791;text-align:center;padding-top:50px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:80px;background:#0d1014;border-top:1px solid #252a31;display:flex}nav button{flex:1;background:none;border:0;color:#737a84;font-size:11px;font-weight:900;cursor:pointer}nav button.active{color:#f5f7fa}
input{display:none}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">CAR<span>DEX</span></div><div class="count" id="count">0 cards</div></header>
<main>
<section id="scanScreen" class="screen active"><div id="idle" class="hero"><div><h1>Spot it.<br>Scan it.<br>Collect it.</h1><p class="copy">Photograph a car and turn it into a collectible trading card.</p></div><button class="action primary" onclick="camera.click()">📷 Take Photo</button><button class="action" onclick="camera.click()">🖼 Choose From Camera Roll</button><input id="camera" type="file" accept="image/*"></div><div id="scanning" class="scan" style="display:none"><div class="ring"><div class="line"></div></div><h2>IDENTIFYING VEHICLE</h2><p class="copy">Analyzing image and creating your card…</p></div><div id="result" style="display:none"><div class="cardwrap"><div class="card" id="card" onclick="card.classList.toggle('flip')"><div class="face" id="front"></div><div class="face back" id="back"></div></div></div><div class="hint">Tap the card to flip</div><button class="action primary" onclick="saveCard()">Add to Garage</button></div></section>
<section id="garageScreen" class="screen"><h1 class="garageTitle">Garage</h1><div class="filters" id="filters"></div><div class="cards" id="cards"></div></section>
</main>
<nav><button id="scanNav" class="active" onclick="show('scan')">＋<br>SCAN</button><button id="garageNav" onclick="show('garage')">▦<br>GARAGE</button></nav>
</div>
<script>
const sample={make:"Porsche",model:"911 GT3 RS",year:2023,rarity:"Legendary",color:"#d69e2e",engine:"4.0L Naturally Aspirated Flat-6",horsepower:518,torque:465,zero:3.0,weight:3268,drive:"RWD",top:184,units:"Limited production"};
let garage=JSON.parse(localStorage.getItem("cardex-garage")||"[]"),pending=null;
const camera=document.getElementById("camera");
camera.onchange=()=>{if(camera.files[0])scan(camera.files[0])};
function show(which){document.getElementById("scanScreen").classList.toggle("active",which==="scan");document.getElementById("garageScreen").classList.toggle("active",which==="garage");scanNav.classList.toggle("active",which==="scan");garageNav.classList.toggle("active",which==="garage");if(which==="garage")renderGarage()}
function scan(file){idle.style.display="none";result.style.display="none";scanning.style.display="flex";setTimeout(()=>{pending={...sample,image:URL.createObjectURL(file),id:Date.now()};scanning.style.display="none";result.style.display="block";renderCard(pending)},1800)}
function renderCard(c){front.innerHTML=`<img class="photo" src="${c.image}"><div class="info"><div class="rarity" style="color:${c.color}">${c.rarity}</div><div class="name">${c.make} ${c.model}</div><div class="grid"><div><div class="label">POWER</div><div class="value">${c.horsepower} HP</div></div><div><div class="label">ENGINE</div><div class="value">${c.engine}</div></div><div><div class="label">0–60</div><div class="value">${c.zero} sec</div></div><div><div class="label">DRIVE</div><div class="value">${c.drive}</div></div></div></div>`;back.innerHTML=`<h2>${c.make} ${c.model}</h2><div class="rarity" style="color:${c.color}">${c.year} • ${c.rarity}</div><div class="grid">${detail("ENGINE",c.engine)}${detail("POWER",c.horsepower+" HP")}${detail("TORQUE",c.torque+" lb-ft")}${detail("0–60 MPH",c.zero+" sec")}${detail("CURB WEIGHT",c.weight.toLocaleString()+" lb")}${detail("DRIVE TYPE",c.drive)}${detail("TOP SPEED",c.top+" MPH")}${detail("UNITS PRODUCED",c.units)}</div>`;card.style.setProperty("--rarity",c.color)}
function detail(a,b){return `<div><div class="label">${a}</div><div class="value">${b}</div></div>`}
function saveCard(){garage.unshift(pending);localStorage.setItem("cardex-garage",JSON.stringify(garage));show("garage")}
function renderGarage(filter="All"){count.textContent=garage.length+" card"+(garage.length===1?"":"s");let vals=["All",...new Set([...garage.map(x=>x.rarity),...garage.map(x=>x.make)])];filters.innerHTML=vals.map(x=>`<button class="filter ${filter===x?"active":""}" onclick="renderGarage('${x.replaceAll("'","")}')">${x}</button>`).join("");let list=filter==="All"?garage:garage.filter(x=>x.rarity===filter||x.make===filter);cards.innerHTML=list.length?list.map((x,i)=>`<div class="mini" onclick="openSaved(${garage.indexOf(x)})"><img src="${x.image}"><strong>${x.make} ${x.model}</strong><small style="color:${x.color}">${x.rarity}</small></div>`).join(""):'<div class="empty" style="grid-column:1/-1">No cards yet. Go spot a car.</div>'}
function openSaved(i){pending=garage[i];show("scan");idle.style.display="none";scanning.style.display="none";result.style.display="block";renderCard(pending)}
renderGarage();
</script>
</body>
</html>
